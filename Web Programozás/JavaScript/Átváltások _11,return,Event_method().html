<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Átváltások</title>
    <style>
        fieldset {border: 1px solid black; border-radius: 5px; width: fit-content;}
        input::placeholder { color: black; font-weight: bold; }
        input { width: 10rem; margin-bottom: 5px; text-align: center; padding: 4px 0;}
        input[type=text] { color: black; }
    </style>
</head>
<body>

    <h1>Átváltások</h1>

    <fieldset><legend><h2>Decimálisról</h2></legend>
        <input type="number" min="0" step="1" max="65535" placeholder="Adj meg egy számot!" onchange="change()" id="decimal"> =
        <!--
            <span id="binary">ide jön binárisan</span>
        -->
        <input type="text" size="18" disabled id="binary"> = 
        <input type="text" size="6" disabled id="hexa">
    </fieldset>

    <form action="#" name="power">
        <fieldset><legend><h2>Teljesítmény</h2></legend>
            <input type="number" min="0" name="LE"> LE =
            <input type="number" name="kW"> kW
        </fieldset>
    </form>

    <script>

        /*********  Átváltás tizes számrendszerből kettesbe, tizenhatosba ******************/

            console.log(document.getElementById("decimal"))
            const decimalInput = document.getElementById("decimal")
                // console.dir(document.getElementById("decimal"))  // mint objektumot
                console.dir(decimalInput)
            
            function change() {
                console.log("OK")
                // console.log(document.getElementById("decimal").value, typeof(document.getElementById("decimal").value) )
                console.log(decimalInput.value, typeof decimalInput.value)
                /*
                    <span id="binary"></span>
                    esetén     
                    document.getElementById("binary").innerText = (Number(decimalInput.value).toString(2)) + " b"
                */
                document.getElementById("binary").value = (Number(decimalInput.value).toString(2)) + " b"
                document.getElementById("hexa").value = (Number(decimalInput.value).toString(16)).toUpperCase() + " h"
            }
        
        /*********  Teljesítmény LE <- -> kW ******************/
        // 1 LE = 0,7355 kW
        // 1 kW = 1,36 LE

            console.log(document.power.LE)
            const powerForm = document.power
            console.log(powerForm.kW)           
            
            /* 
                // powerForm.LE.onchange = function () { console.log(powerForm.LE.value) }
                powerForm.LE.onchange = () => { 
                    if(powerForm.LE.value < 0) {powerForm.LE.value = 0 }
                    // powerForm.kW.value = Math.round((1.36 * powerForm.LE.value) * 10) / 10
                    powerForm.kW.value = Number(powerForm.LE.value / 1.36).toFixed(1)
            */

            // eseménykezelő method
        
            powerForm.LE.addEventListener("change", function () {       // anonim függvény
            // powerForm.LE.addEventListener("change", () => {          // anonim nyílfüggvény
                if(powerForm.LE.value < 0) {powerForm.LE.value = 0 }
                powerForm.kW.value = Number(powerForm.LE.value / 1.36).toFixed(1)
            })

            powerForm.kW.onchange = () => {
                /* 
                powerForm.kW.value = Math.abs(powerForm.kW.value)
                powerForm.LE.value = (powerForm.kW.value * 1.36).toFixed(0
                */
                powerForm.LE.value = LE()
            }

            function LE() {
                powerForm.kW.value = Math.abs(powerForm.kW.value) 
                return Number((powerForm.kW.value * 1.36).toFixed(0))
            }

            


        /*********  Hőmérséklet Celisus - Kelvin - Fahrenheit ******************/
        //  °F = (°C × 1,8) + 32
        //  °C = (°F - 32 ) / 1,8
        //  0°C = 273 K; 0 K = -273°C
        // min. 0°K, min. -273°C, min ? °F


    </script>

</body>
</html>
