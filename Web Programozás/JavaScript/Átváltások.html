<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Átváltások</title>
    <style>
        html{font-family: sans-serif;}
        fieldset{
            border: 1px solid black;
            border-radius: 3px;
            width: fit-content;
        }
        input[type=text]{color: black;}
        input{text-align: center; padding: 2px;}
        input::placeholder{color: red;}
    </style>
</head>
<body>
    <h1>Átváltások</h1>
    <fieldset><legend><h2>Decimálisról</h2></legend>
        <input type="number" min="0" step="1" placeholder="adj meg egy számot" onchange="change()" id="decimal">&nbsp;=
        <!--<span id="binary"></span>-->
        <input type="text" size="10" disabled id="binary">&nbsp;=
        <input type="text" disabled size="6" id="hexdec">
    </fieldset>

    <form action="#" name="Power">
        <fieldset><legend><h2>Teljesítmény</h2></legend>
            <input type="number" name="LE" min="0" max="5000"> LE&nbsp;=
            <input type="number" name="KW" min="0"> kW
        </fieldset>
    </form>

    <form action="#" name="Temp">
        <fieldset><legend><h2>Teljesítmény</h2></legend>
            <input type="number" name="C" min="-273"> C&nbsp;=
            <input type="number" name="F" min="-459"> F&nbsp;=
            <input type="number" name="K" min="0"> K
        </fieldset>
    </form>

    <script>
        const decIn = (document.getElementById("decimal"))
        console.dir(decIn)
        function change(){
            document.getElementById("binary").value = Number(decIn.value).toString(2)+" b"
            document.getElementById("hexdec").value = Number(decIn.value).toString(16).toUpperCase()+" h"
        }
        
        const power = document.Power;
        power.LE.onchange = function () { console.log(power.LE.value) }
        power.LE.onchange = () => {

            if (power.LE.value<0) {power.LE.value = 0}
            power.KW.value = Number(1.36 * power.LE.value).toFixed(2)
        }
        power.KW.onchange = () => {

            power.KW.value = Math.abs(power.KW.value)
            power.LE.value = Number(power.KW.value/1.36).toFixed(0)
        }
    
        const temp = document.Temp
        temp.C.onchange = () => {
            temp.F.value = (Number(temp.C.value)*9/5+32)
            temp.K.value = (Number(temp.C.value)+273)
        }
        temp.K.onchange = () => {
            temp.C.value = (Number(temp.K.value)-273)
            temp.F.value = (Number(temp.C.value)*9/5+32)
        }
        temp.F.onchange = () => {
            temp.C.value = Math.round((Number(temp.F.value)-32)/(9/5))
            temp.K.value = (Number(temp.C.value)+273)
        }

    </script>
</body>
</html>
